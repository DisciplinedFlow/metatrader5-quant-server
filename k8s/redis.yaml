apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mt5-quant
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume + AOF: never run two writers
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          # redis:6 with persistence, matching compose exactly.
          # (ChatGPT doc used redis:7 with no persistence — tick stream,
          # celery results, HMM cache and beat state would vanish on restart.)
          image: redis:6
          args:
            - redis-server
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mt5-quant
spec:
  ports:
    - port: 6379
  selector:
    app: redis
